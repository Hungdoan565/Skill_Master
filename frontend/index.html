<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Skill Master - Hệ thống đào tạo Anh ngữ và Tin học hàng đầu. Chinh phục IELTS, TOEIC, MOS với phương pháp học hiện đại."
    />
    <meta name="theme-color" content="#18181B" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect to Supabase (API & Storage) -->
    <link rel="preconnect" href="https://aycxwituqgyjueeuooic.supabase.co" crossorigin />
    
    <!-- DNS Prefetch for image CDNs -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://randomuser.me" />

    <title>Skill Master - Chinh phục Anh ngữ & Tin học</title>
  </head>
  <body class="antialiased">
    <script>
      // Prevent dark mode flash - apply theme before React hydrates
      (function() {
        var theme = localStorage.getItem('admin-theme') || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
