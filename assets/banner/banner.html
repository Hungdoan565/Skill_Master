<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Skill Master Banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1280px;
      height: 640px;
      background-color: #F9F8F6; /* Warm off-white */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .background-accent {
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 77, 0, 0.05) 0%, rgba(249, 248, 246, 0) 70%);
      z-index: 0;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .left-panel {
      flex: 0 0 520px;
      padding: 100px 60px 100px 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      width: 320px;
      margin-bottom: 40px;
      /* Remove background or use mix-blend-mode if logo has white background */
      mix-blend-mode: multiply; 
    }

    .subtitle {
      font-size: 32px;
      font-weight: 400;
      color: #333333;
      line-height: 1.4;
      border-left: 5px solid #FF4D00; /* Orange accent */
      padding-left: 24px;
      max-width: 450px;
      letter-spacing: -0.5px;
    }

    .right-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .screenshot-wrapper {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 900px; /* Bleeds off the right edge */
      border-radius: 12px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      background-color: white;
    }

    .browser-chrome {
      height: 40px;
      background-color: #F1F1F1;
      border-bottom: 1px solid #E5E5E5;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot.red { background-color: #FF5F56; }
    .dot.yellow { background-color: #FFBD2E; }
    .dot.green { background-color: #27C93F; }

    .screenshot {
      width: 100%;
      display: block;
      /* If the screenshot is too tall, we just show the top part */
      object-fit: cover;
      object-position: top;
      max-height: 520px;
    }
  </style>
</head>
<body>
  <div class="background-accent"></div>
  <div class="container">
    <div class="left-panel">
      <!-- Ensure path is correct for absolute serving if using file:// or just relative if in same dir structure -->
      <img src="../../frontend/src/assets/logo.png" alt="Skill Master" class="logo">
      <div class="subtitle">Nền tảng quản lý<br>Anh ngữ & Tin học</div>
    </div>
    <div class="right-panel">
      <div class="screenshot-wrapper">
        <div class="browser-chrome">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <img src="../../frontend/playwright-student-grades.png" alt="Product Screenshot" class="screenshot">
      </div>
    </div>
  </div>
</body>
</html>
